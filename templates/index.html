<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ЕГЭ по информатике</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>

        <header class="header">
        <div class="logo">
            <span class="logo-icon">&lt;/&gt;</span>
            <span>ЕГЭ Информатика</span>
        </div>

    </header>


        <main class="content">
            <section class="welcome">
                <h1>Подготовка к ЕГЭ по информатике</h1>
            </section>

            <section class="tasks">
                <h2>Все задания</h2>
                <p class="section-description">
                    Выбери номер задания, чтобы изучить его решения.
                </p>

                <div class="task-grid">
                    {% for number, title in titles.items() %}
                    <a href="{{ url_for('task', number=number) }}" class="task-card">
                        <span class="task-number">{{ number }}</span>
                        <span class="task-name">{{ title }}</span>
                        <span class="task-arrow">→</span>
                    </a>
                    {% endfor %}
                </div>
            </section>
        </main>
    </body>
</html>
